name: readme-version

# Reusable check: a repo's README.md must declare its released version with
# a `<!-- mechub-version: ... -->` marker, and that marker must match the
# latest `v*` git tag (or be exactly `unreleased` when no tag exists yet).
#
# Call it from a mechubsec repo, pinned to a commit SHA:
#
#   jobs:
#     readme-version:
#       uses: mechubsec/.github/.github/workflows/readme-version.yml@<commit sha>
#
# Why a marker instead of parsing README prose: existing READMEs state their
# version inconsistently (blockquote, prose paragraph, or not at all), and
# regexing free-form prose for a value that gates CI is exactly the kind of
# non-deterministic parsing Mechub's house rule warns against. A single
# HTML-comment marker, invisible when rendered, is unambiguous to check.

on:
  workflow_call:
    inputs:
      readme:
        description: Path to the README in the caller repo.
        type: string
        default: README.md

permissions:
  contents: read

jobs:
  readme-version:
    name: readme-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # In a called workflow, checkout fetches the *caller's* repository.
      # Full history (and tags) so the latest v* tag can be found.
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checker script lives in this (mechubsec/.github) repo, not the
      # caller's. Reusable workflows don't get their own repo checked out
      # automatically, so fetch it ourselves — pinned to the exact ref the
      # caller invoked this workflow at, never floating main, so a bad edit
      # here can't silently change behaviour for every caller still pinned
      # to an older sha.
      - name: Resolve the pinned ref of this reusable workflow
        id: resolve
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          echo "ref=${WORKFLOW_REF#*@}" >> "$GITHUB_OUTPUT"

      - name: Check out mechubsec/.github (checker script)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mechubsec/.github
          ref: ${{ steps.resolve.outputs.ref }}
          path: .mechub-dot-github
          persist-credentials: false

      - name: README version marker matches latest tag
        run: .mechub-dot-github/.github/scripts/check-readme-version.sh --readme "${{ inputs.readme }}"
