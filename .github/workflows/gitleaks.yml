name: gitleaks

# Reusable secret scan for every mechubsec repository. Call it from a repo with:
#
#   jobs:
#     secrets:
#       uses: mechubsec/.github/.github/workflows/gitleaks.yml@<commit sha>
#
# The gitleaks binary, not gitleaks-action: the Action requires a paid
# GITLEAKS_LICENSE for organization-owned repositories and fails closed without
# one, which reads as a red security check that never scanned anything. The
# MIT-licensed binary has no such limit. Pinned by version and sha256 so a
# compromised release cannot slip in; bump both together, here, once.

on:
  workflow_call:
    inputs:
      config:
        description: Path to the gitleaks config in the caller repo. Used only if the file exists; otherwise gitleaks' built-in rules apply.
        type: string
        default: .gitleaks.toml
      full-history:
        description: Scan every commit on every run instead of just the event's range. For repos whose history is already clean and should stay provably so.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # In a called workflow, checkout fetches the *caller's* repository.
      # Full history so `gitleaks git` can walk every commit.
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks

      # Scan the commits this event introduces, as gitleaks-action did: a PR
      # scans base..head, a push scans before..after. Scanning full history on
      # every run instead would re-fail on already-published fixtures forever
      # and teach everyone to ignore a red check. A manual or scheduled run
      # scans full history, which is how the backlog gets audited.
      # `detect` was removed in 8.x; the subcommands are dir, git and stdin.
      # Everything reaches the script through env, never interpolated into it.
      - name: gitleaks (secrets)
        env:
          GITLEAKS_CONFIG_PATH: ${{ inputs.config }}
          FULL_HISTORY: ${{ inputs.full-history }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(git . --redact --no-banner)
          if [ -f "$GITLEAKS_CONFIG_PATH" ]; then
            args+=(--config "$GITLEAKS_CONFIG_PATH")
          fi
          zero_sha=0000000000000000000000000000000000000000
          scan_event="$EVENT_NAME"
          if [ "$FULL_HISTORY" = "true" ]; then
            scan_event=full-history
          fi
          case "$scan_event" in
            pull_request|pull_request_target)
              scan_range="${PR_BASE_SHA}..${PR_HEAD_SHA}" ;;
            push)
              # A new branch has no "before"; scan just the pushed commit.
              if [ -z "$PUSH_BEFORE_SHA" ] || [ "$PUSH_BEFORE_SHA" = "$zero_sha" ]; then
                scan_range="-1 ${PUSH_AFTER_SHA}"
              else
                scan_range="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
              fi ;;
            *)
              scan_range="" ;;
          esac
          if [ -n "$scan_range" ]; then
            echo "Scanning commit range: $scan_range"
            args+=(--log-opts="$scan_range")
          else
            echo "Scanning full history ($scan_event)"
          fi
          gitleaks "${args[@]}"
