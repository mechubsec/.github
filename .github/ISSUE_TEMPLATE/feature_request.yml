name: Feature request
description: Suggest an improvement to a mechub project.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve, and who experiences it?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release or commit are you using today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior or interface you would like to see.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What outcome would indicate that the problem is solved?
    validations:
      required: true
