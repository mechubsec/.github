name: Feature request
description: Suggest an improvement for a mechub project.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user or operator problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
      description: Describe the behavior or outcome you would like.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which project version or commit are you using?
      placeholder: e.g. 1.2.3 or abc1234
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should happen after this feature is implemented?
    validations:
      required: true
