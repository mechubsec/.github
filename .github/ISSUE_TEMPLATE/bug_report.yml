name: Bug report
description: Report a reproducible problem in a mechub project.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real device data.** Redact hostnames, IP addresses, serial numbers, usernames, credentials, keys, SNMP communities, and free-text descriptions from configs, logs, and error output before posting. Security problems go through [SECURITY.md](https://github.com/mechubsec/.github/blob/main/SECURITY.md), not public issues.
  - type: checkboxes
    id: redaction
    attributes:
      label: Data hygiene
      options:
        - label: I have removed real hostnames, IPs, serials, credentials, and other device data from this report.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what went wrong and include relevant context only after redacting hostnames, IPs, serials, credentials, and other real device data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which project version or commit are you using?
      placeholder: e.g. 1.2.3 or abc1234
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem, after redacting hostnames, IPs, serials, credentials, and other real device data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen?
    validations:
      required: true
