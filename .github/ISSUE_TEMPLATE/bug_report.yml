name: Bug report
description: Report a reproducible problem in a mechub project.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what went wrong and include relevant context.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which project version or commit are you using?
      placeholder: e.g. 1.2.3 or abc1234
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen?
    validations:
      required: true
