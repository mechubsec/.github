name: Bug report
description: Report a reproducible problem in a mechub project.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what went wrong and include relevant error output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release, commit, or image tag were you using?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen instead?
    validations:
      required: true
